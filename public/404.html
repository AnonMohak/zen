<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f3e4da" />
    <title>404 · Zen Garden</title>
    <!-- Cloudflare Pages serves this file for unknown paths. Vite copies it as is
         (no base rewrite), so links must be absolute. When the garden gets a path
         on me-momo.co.in, change the first link to that path (e.g. /three/zen/). -->
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #f3e4da;
        color: #4e3236;
        font-family: 'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif JP', 'Iowan Old Style', Georgia, serif;
        display: grid;
        place-items: center;
        padding: 16px;
        text-align: center;
      }
      main { max-width: 420px; }
      .mark { margin: 0; font-size: 56px; line-height: 1; color: #6b4a4e; opacity: 0.8; }
      h1 { margin: 18px 0 0; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; }
      p { margin: 10px 0 28px; font-size: 15px; line-height: 1.6; color: #6b4a4e; }
      a {
        display: inline-block; padding: 9px 20px;
        border: 1px solid rgba(78, 50, 54, 0.35); border-radius: 999px;
        color: #4e3236; text-decoration: none; font-size: 14px; letter-spacing: 0.06em;
        transition: background-color 0.3s, border-color 0.3s;
      }
      a:hover, a:focus-visible { border-color: #4e3236; background: rgba(78, 50, 54, 0.06); }
      a:focus-visible { outline: 2px solid #4e3236; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="mark" aria-hidden="true">庭</p>
      <h1>404 · An empty path</h1>
      <p>The gravel here is raked, but nothing stands on it.<br />This page does not exist.</p>
      <a href="/">Return to the garden</a>
    </main>
  </body>
</html>
